name: Protected Pumila formal source migration
on:
  push:
    branches: [prepare/pumila-formal-0301]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Strict published dependency graph and source transaction
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          caps --strict --ci
          yarn install --mode=update-lockfile
          yarn install --immutable
          caps verify --toolchain
          node prepare-source.mjs apply
      - name: Original browser/native/public gates and complete strict
        run: |
          set -euo pipefail
          calcit calcit.cirru fix --workflow strict --verify --format json | tee acceptance/strict.json
          jq -e '.data.workflow.status == "passed" and .diagnostics == []' acceptance/strict.json
          before_blob="$(git hash-object calcit.cirru)"
          calcit calcit.cirru edit format
          test "$(git hash-object calcit.cirru)" = "$before_blob"
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry server --check-only
          calcit --entry server test app.schema/as-score --require-match
          calcit analyze check-public --ns app.client --ns app.comp.container --ns app.comp.dashboard --ns app.comp.emotion-form --ns app.comp.emotions --ns app.comp.history --ns app.comp.kit --ns app.comp.login --ns app.comp.navigation --ns app.comp.profile --ns app.config --ns app.schema --ns app.style
          calcit --entry server analyze check-public --ns 'app.$meta' --ns app.config --ns app.schema --ns app.server --ns app.twig.container --ns app.twig.user --ns app.updater --ns app.updater.emotion --ns app.updater.mood --ns app.updater.router --ns app.updater.session --ns app.updater.user
          yarn compile-page
          VITE_BASE_URL=./ yarn release-page
          node prepare-source.mjs verify
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: pumila-accepted-source
          path: |
            calcit.cirru
            yarn.lock
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pumila-diagnostics
          path: acceptance
          if-no-files-found: warn
          retention-days: 30
